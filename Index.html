<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>YO! PRESSO เมนูสั่งเครื่องดื่ม</title>
<style>
  :root{--maroon:#7a1a14;--maroon2:#9b2a22;--paper:#fef6e9;--card:#fffaf1;--line:#e6d3b8;--ink:#3a1512;--mute:#8a6d5f;--gold:#f3d9a8}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--maroon);font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;overflow:hidden}
  input{-webkit-user-select:text;user-select:text}
  button{font:inherit;color:inherit;cursor:pointer}

  .app{height:100dvh;display:grid;grid-template-columns:1fr;grid-template-rows:1fr auto;grid-template-areas:"main" "bar"}
  main{grid-area:main;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .poster{max-width:820px;margin:0 auto;padding:0 16px 24px}
  .checker{height:40px;margin:0 -16px 14px;background:conic-gradient(var(--maroon) 25%,transparent 0 50%,var(--maroon) 0 75%,transparent 0) 0 0/40px 40px}

  /* หัวเมนู */
  .brand{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;border-bottom:2px solid var(--maroon);padding-bottom:8px}
  .logo{display:flex;align-items:center;gap:10px}
  .logo svg{width:38px;height:38px;flex:none}
  .logo b{font-size:clamp(24px,6vw,40px);letter-spacing:.14em;font-weight:600;white-space:nowrap}
  .tag{font-size:clamp(12px,3vw,20px);letter-spacing:.02em;white-space:nowrap}
  .big{font-size:clamp(54px,16vw,120px);font-weight:900;letter-spacing:.06em;line-height:1;margin:14px 0 4px}
  .hint{font-size:13px;color:var(--mute);margin:0 0 10px}
  .promo{display:none;background:var(--maroon);color:#fff;border-radius:12px;padding:10px 14px;font-size:15px;font-weight:700;margin:0 0 12px}
  .promo.on{display:block}
  .promo-row{color:#a1261b;font-weight:700}
  .promo-hint{background:#fff2cc;color:var(--maroon);border-radius:10px;padding:8px 12px;font-size:14px;margin:8px 0}
  #hello{font-weight:700}

  /* โครงเมนู */
  .cols{display:grid;grid-template-columns:1fr;gap:0}
  .sec{padding:12px 0;border-bottom:1px solid var(--maroon)}
  .pics{display:flex;justify-content:center;margin-bottom:8px}
  .pics img{max-width:100%;height:auto;display:block;pointer-events:none}
  .sechd{display:grid;grid-template-columns:1fr 78px 78px;align-items:end;border-bottom:2px dashed var(--maroon);padding-bottom:4px;margin-bottom:2px}
  .sechd h2{margin:0;font-size:20px;letter-spacing:.02em}
  .sechd span{text-align:center;font-weight:800;font-size:14px;letter-spacing:.04em}

  /* แถวเมนู */
  .row{display:grid;grid-template-columns:1fr 78px 78px;align-items:center;min-height:58px;border-bottom:1px dotted #d9b99a}
  .row:last-child{border-bottom:0}
  .nm{border:0;background:transparent;text-align:left;padding:6px 4px 6px 0;display:flex;flex-direction:column;gap:1px;min-height:58px;justify-content:center}
  .nm b{font-size:15px;letter-spacing:.07em;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .nm small{font-size:12px;color:var(--mute);letter-spacing:0}
  .thumb{width:15px;height:15px;fill:var(--maroon);flex:none}
  .pr{position:relative;border:2px solid transparent;background:transparent;border-radius:14px;height:50px;margin:0 3px;font-size:19px;font-weight:700;letter-spacing:.04em;color:var(--maroon);transition:transform .08s,background .08s}
  .pr.on-p{background:#fff;border-color:var(--maroon)}
  .pr:active{transform:scale(.92);background:var(--maroon);color:#fff}
  .pr.none{visibility:hidden;pointer-events:none}
  .pr .cnt{position:absolute;top:-7px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--maroon);color:#fff;font-size:12px;display:none;align-items:center;justify-content:center;padding:0 5px}
  .pr .cnt.on{display:flex}
  .pr.h{color:#a73a12}

  /* สมูทตี้ */
  .smoo{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
  .sm{position:relative;border:2px solid var(--maroon);border-radius:14px;background:#fff;padding:10px 4px;min-height:64px;font-size:12px;letter-spacing:.06em;font-weight:700;text-align:center;line-height:1.3}
  .sm:active{background:var(--maroon);color:#fff;transform:scale(.95)}
  .sm .cnt{position:absolute;top:-8px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--maroon);color:#fff;font-size:12px;display:none;align-items:center;justify-content:center;padding:0 5px}
  .sm .cnt.on{display:flex}
  .sm span{display:block;font-size:20px;margin-top:2px}

  /* เมล็ดพรีเมียม */
  .bean{display:flex;gap:12px;align-items:center}
  .bean img{width:42%;max-width:240px;height:auto;pointer-events:none}
  .bean h2{margin:0 0 6px;font-size:18px}
  .bean p{margin:2px 0;font-size:14px;letter-spacing:.05em}
  .bean p small{color:var(--mute);letter-spacing:0}
  .plus{font-size:28px;font-weight:800;margin-top:6px}
  .foot{display:flex;align-items:flex-end;gap:10px}
  .foot .sec{flex:1;border-bottom:0}
  .foot img{width:40%;max-width:260px;height:auto;pointer-events:none}

  /* แถบตะกร้า (มือถือ) */
  .bar{grid-area:bar;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--paper);border-top:2px solid var(--maroon)}
  .btn{width:100%;border:0;border-radius:16px;background:var(--maroon);color:#fff;font-size:18px;padding:16px;display:flex;justify-content:space-between;align-items:center;min-height:56px}
  .btn:active{background:var(--maroon2)}
  .btn[disabled]{opacity:.4}
  .btn.ghost{background:transparent;border:2px solid var(--maroon);color:var(--maroon);margin-top:8px;justify-content:center}
  .btn.center{justify-content:center}

  /* หน้าต่างลอย */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:20}
  .overlay.show{display:flex}
  .sheet{background:var(--paper);color:var(--ink);width:100%;max-height:92dvh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  .sheet h2{margin:0;font-size:22px;color:var(--maroon)}
  .sub{color:var(--mute);font-size:13px}
  .grp{margin:16px 0 8px;font-size:14px;color:var(--mute);font-weight:700}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
  .opts.one{grid-template-columns:1fr}
  .opt{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:14px 10px;font-size:16px;min-height:54px;text-align:center}
  .opt small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
  .opt.on{border-color:var(--maroon);background:var(--maroon);color:#fff}
  .opt.on small{color:#f3d9a8}
  .qty{display:flex;align-items:center;justify-content:center;gap:24px;margin:4px 0}
  .qty button{width:56px;height:56px;border-radius:50%;border:2px solid var(--maroon);background:#fff;color:var(--maroon);font-size:30px;line-height:1}
  .qty b{font-size:28px;min-width:40px;text-align:center}
  input{width:100%;border:2px solid var(--line);border-radius:12px;padding:14px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}

  /* ตะกร้า */
  .crow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:15px}
  .crow small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
  .rowr{text-align:right;white-space:nowrap}
  .mini{display:inline-flex;align-items:center;gap:8px;margin-top:6px}
  .mini button{width:34px;height:34px;border-radius:50%;border:2px solid var(--maroon);background:#fff;color:var(--maroon);font-size:18px;line-height:1}
  .total{display:flex;justify-content:space-between;font-size:20px;font-weight:700;margin:14px 0;color:var(--maroon)}
  .empty{text-align:center;color:var(--mute);padding:40px 10px}
  .done{text-align:center;padding:30px 10px}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:40;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%)}
  .cartpane{display:none}

  /* แท็บเล็ต / จอใหญ่: เมนู 2 คอลัมน์เหมือนเมนูกระดาษ + ตะกร้าด้านขวา */
  @media (min-width:900px){
    .app{grid-template-columns:1fr 380px;grid-template-rows:1fr;grid-template-areas:"main cart"}
    .bar{display:none}
    .cartpane{grid-area:cart;display:block;overflow-y:auto;background:var(--card);color:var(--ink);border-left:2px solid var(--maroon);padding:16px}
    .cartpane h2{color:var(--maroon)}
    .poster{max-width:none;padding:0 20px 30px}
    .checker{margin:0 -20px 14px}
    #ovCart{display:none!important}
    .overlay{align-items:center;justify-content:center}
    .sheet{width:560px;border-radius:24px;max-height:90dvh}
    .cols{grid-template-columns:1fr 1fr;column-gap:0}
    .cols>.left{border-right:2px solid var(--maroon);padding-right:16px}
    .cols>.right{padding-left:16px}
    .sec:last-child{border-bottom:0}
  }
  @media (min-width:900px) and (max-width:1250px){
    .sechd,.row{grid-template-columns:1fr 66px 66px}
    .pr{font-size:17px;margin:0 2px}
    .nm b{font-size:13px}
  }
</style>
</head>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
/* ============ ตั้งค่า (แก้ตรงนี้) ============ */
const CONFIG = {
  LIFF_ID: "2012167073-dEdFgv4G",
  ENDPOINT: "https://script.google.com/macros/s/AKfycbxmZasvnoV1DAYPeiomrZqUqCBfF8Cy54ROB-5R5poE-SeD-qgkQOguEW1dhlqDg4JUzA/exec",
  BEAN_EXTRA: 15,
  // ส่วนลด: สั่งครบ cups แก้ว ลดทันที amount บาท  (repeat:true = ลดซ้ำทุกครบ cups แก้ว, false = ลดครั้งเดียวต่อออเดอร์)
  // ปิดส่วนลด: ตั้ง DISCOUNT: null  (ต้องแก้ค่าให้ตรงกันใน Apps Script ด้วย)
  DISCOUNT: {cups: 2, amount: 20, repeat: true}
};

/* ============ เมนู (แก้ราคา/เพิ่มเมนูได้ที่นี่) ============
   hot / iced = ราคา · bean = เลือกเมล็ดพรีเมียม (+15) · sweet = เลือกระดับหวาน · reco = รูปนิ้วโป้ง */
const MENU = [
  {cat:"coffee", name:"Espresso", th:"เอสเพรสโซ่", hot:45, iced:70, bean:true, sweet:true},
  {cat:"coffee", name:"Americano", th:"อเมริกาโน่", hot:55, iced:60, bean:true, reco:true, sweet:true},
  {cat:"coffee", name:"Latte / Cappuccino", th:"ลาเต้ / คาปูชิโน่", hot:60, iced:70, bean:true, sweet:true, variants:["Latte","Cappuccino"]},
  {cat:"coffee", name:"Mocha", th:"มอคค่า", hot:65, iced:75, bean:true, sweet:true},
  {cat:"coffee", name:"Black Yuzu", th:"กาแฟยูซุ", iced:85, bean:true, sweet:true},
  {cat:"coffee", name:"Black Orange", th:"กาแฟส้ม", iced:85, bean:true, sweet:true, reco:true},
  {cat:"coffee", name:"Black Coconut", th:"กาแฟมะพร้าว", iced:85, bean:true, sweet:true},
  {cat:"coffee", name:"X Bloom Coffee", th:"", iced:100, bean:true, reco:true, sweet:true},

  {cat:"non", name:"Matcha Latte", th:"มัทฉะ ลาเต้", hot:70, iced:80, sweet:true},
  {cat:"non", name:"Clear Matcha", th:"เคลียมัทฉะ", iced:80, sweet:true},
  {cat:"non", name:"Matcha Coconut", th:"มัทฉะมะพร้าว", iced:90, sweet:true},
  {cat:"non", name:"Dark Chocolate", th:"ดาร์กช็อกโกแลต", hot:70, iced:80, sweet:true},
  {cat:"non", name:"Thai Tea Latte", th:"ชาไทย", iced:80, sweet:true},
  {cat:"non", name:"Orange Juice", th:"น้ำส้มสด", iced:75, sweet:true},

  {cat:"smoothie", name:"Yogurt Smoothie", th:"โยเกิร์ตสมูทตี้", iced:90, variants:["Strawberry","Blueberry","Mango"], sweet:true},

  {cat:"special", name:"Yo Presso", th:"โย่ว! เพรสโซ่", iced:85, bean:true, reco:true, sweet:true},
  {cat:"special", name:"Yuzu Presso", th:"ยูซุ เพรสโซ่", iced:85, bean:true, reco:true, sweet:true},
  {cat:"special", name:"Dirty", th:"เดอร์ตี้", iced:85, bean:true, sweet:true},
  {cat:"special", name:"Affogato", th:"อัลฟาเกโต้", iced:85, sweet:true}
];
const SWEET = ["100% หวานปกติ","50% หวานปานกลาง","25% หวานน้อย"];
const BEANS = [
  {k:"", label:"เมล็ดปกติ", sub:""},
  {k:"YO Blend 1 (คั่วกลาง · Chocolate Nutty)", label:"YO Blend 1", sub:"คั่วกลาง · Chocolate Nutty +15"},
  {k:"YO Blend 2 (คั่วอ่อน · Fruity Berry)", label:"YO Blend 2", sub:"คั่วอ่อน · Fruity Berry +15"}
];
const THUMB = '<svg class="thumb" viewBox="0 0 24 24"><path d="M2 10h4v11H2zM8 21h9.4a2 2 0 0 0 1.95-1.55l1.6-7A2 2 0 0 0 19 10h-5.2l.8-3.8a2.5 2.5 0 0 0-.7-2.3L13 3 8 8.6z"/></svg>';

/* ============ state ============ */
let cart = [], user = {userId:"", displayName:""}, sel = null, pickup = "ตอนนี้ (เร็วที่สุด)", sending = false;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const baht = n => "฿" + n.toLocaleString("th-TH");
const buzz = () => { try { navigator.vibrate && navigator.vibrate(12); } catch(e){} };
let toastT;
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 1400); }

/* ============ LIFF ============ */
async function initLiff(){
  if (CONFIG.LIFF_ID.startsWith("YOUR_")) { user = {userId:"demo", displayName:"ทดสอบ"}; return; }
  try {
    await liff.init({liffId: CONFIG.LIFF_ID});
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const p = await liff.getProfile();
    user = {userId: p.userId, displayName: p.displayName};
    $("hello").textContent = "สวัสดีคุณ " + p.displayName + " · แตะราคา ร้อน / เย็น เพื่อสั่งได้เลย";
  } catch(e){ console.error(e); }
}

/* ============ ราคา/รายการ ============ */
// เมนูที่ไม่มีตัวเลือกอื่น นอกจากร้อน/เย็น: แตะราคาแล้วเข้าตะกร้าทันที
const isDirect = m => !!(!m.variants && !m.bean && !m.sweet);
const unit = s => { const m = MENU[s.i]; return (s.temp === "ร้อน" ? m.hot : m.iced) + (s.bean ? CONFIG.BEAN_EXTRA : 0); };
const lineName = s => MENU[s.i].name + (s.variant ? ` (${s.variant})` : "");
const lineDetail = s => [s.temp, s.bean, s.sweet, s.note && "หมายเหตุ: " + s.note].filter(Boolean).join(" · ");
const subtotal = () => cart.reduce((t, s) => t + unit(s) * s.qty, 0);
const count = () => cart.reduce((t, s) => t + s.qty, 0);
const discountAmt = () => {
  const D = CONFIG.DISCOUNT, c = count();
  if (!D || c < D.cups) return 0;
  return D.repeat ? Math.floor(c / D.cups) * D.amount : D.amount;
};
const total = () => Math.max(0, subtotal() - discountAmt());
const promoText = () => { const D = CONFIG.DISCOUNT; return D ? `โปรโมชัน: สั่ง ${D.cups} แก้ว ลดทันที ${baht(D.amount)}${D.repeat ? " (ครบทุก " + D.cups + " แก้ว)" : ""}` : ""; };
const countOf = (i, temp, variant) => cart.filter(s => s.i === i && (!temp || s.temp === temp) && (variant === undefined || s.variant === variant)).reduce((t, s) => t + s.qty, 0);
const sameLine = (a, b) => ["i","temp","variant","bean","sweet","note"].every(k => a[k] === b[k]);
function addLine(line){
  const f = cart.find(s => sameLine(s, line));
  if (f) f.qty = Math.min(50, f.qty + line.qty); else cart.push({...line});
}

/* ============ วาดเมนู (หน้าตาเหมือนเมนูกระดาษ) ============ */
function priceBtn(i, temp){
  const m = MENU[i], p = temp === "ร้อน" ? m.hot : m.iced;
  if (!p) return `<button class="pr none" tabindex="-1" aria-hidden="true"></button>`;
  const n = countOf(i, temp);
  return `<button class="pr ${temp === "ร้อน" ? "h" : ""}" data-i="${i}" data-t="${temp}" aria-label="${esc(m.name)} ${temp} ${p} บาท">${p}<span class="cnt ${n ? "on" : ""}">${n}</span></button>`;
}
function renderRows(cat, el){
  el.innerHTML = MENU.map((m,i) => ({m,i})).filter(x => x.m.cat === cat).map(({m,i}) =>
    `<div class="row"><button class="nm" data-i="${i}" data-t=""><b>${esc(m.name).toUpperCase()}${m.reco ? THUMB : ""}</b><small>${esc(m.th)}</small></button>${priceBtn(i,"ร้อน")}${priceBtn(i,"เย็น")}</div>`
  ).join("");
}
function renderSpecial(el){
  // เมนูพิเศษมีคอลัมน์ราคาเดียว (เย็น)
  el.innerHTML = MENU.map((m,i) => ({m,i})).filter(x => x.m.cat === "special").map(({m,i}) => {
    const n = countOf(i, "เย็น");
    return `<div class="row" style="grid-template-columns:1fr 78px"><button class="nm" data-i="${i}" data-t=""><b>${esc(m.name).toUpperCase()}${m.reco ? THUMB : ""}</b><small>${esc(m.th)}</small></button><button class="pr" data-i="${i}" data-t="เย็น">${m.iced}<span class="cnt ${n ? "on" : ""}">${n}</span></button></div>`;
  }).join("");
}
function renderSmoothie(el){
  const i = MENU.findIndex(m => m.cat === "smoothie"), m = MENU[i];
  el.innerHTML = m.variants.map(v => {
    const n = countOf(i, "เย็น", v);
    return `<button class="sm" data-i="${i}" data-v="${v}">${v.toUpperCase()}<span>${m.iced}</span><b class="cnt ${n ? "on" : ""}">${n}</b></button>`;
  }).join("");
}
function renderMenu(){
  renderRows("coffee", $("g-coffee"));
  renderRows("non", $("g-non"));
  renderSmoothie($("g-smoothie"));
  renderSpecial($("g-special"));
}
// แตะที่ไหนในเมนูก็ได้ (event delegation)
document.querySelector(".poster").addEventListener("click", ev => {
  const sm = ev.target.closest(".sm");
  if (sm) { buzz(); openItem(+sm.dataset.i, "เย็น"); sel.variant = sm.dataset.v; drawItem(); return; }
  const b = ev.target.closest(".pr, .nm");
  if (!b || b.classList.contains("none")) return;
  buzz();
  const i = +b.dataset.i, m = MENU[i];
  const temp = b.dataset.t || (m.iced ? "เย็น" : "ร้อน");
  if (isDirect(m) && b.dataset.t) { addLine({i, temp, variant:"", bean:"", sweet:"", qty:1, note:""}); toast("เพิ่ม " + m.name + " (" + temp + ") แล้ว"); refresh(); return; }
  openItem(i, temp);
});

/* ============ เลือกตัวเลือก ============ */
function openItem(i, temp){
  const m = MENU[i];
  sel = {i, temp, variant: m.variants ? m.variants[0] : "", bean:"", sweet: m.sweet ? SWEET[0] : "", qty:1, note:""};
  drawItem();
  $("ovItem").classList.add("show");
}
function opts(list, cur, key, cls){
  return `<div class="opts ${cls||""}">` + list.map(o => {
    const v = typeof o === "string" ? o : o.k, l = typeof o === "string" ? o : o.label, sub = typeof o === "string" ? "" : o.sub;
    return `<button class="opt ${v===cur?"on":""}" data-k="${key}" data-v="${esc(v)}">${esc(l)}${sub ? `<small>${esc(sub)}</small>` : ""}</button>`;
  }).join("") + `</div>`;
}
function drawItem(){
  const m = MENU[sel.i];
  const temps = [m.hot && {k:"ร้อน", label:"ร้อน", sub:baht(m.hot)}, m.iced && {k:"เย็น", label: m.hot ? "เย็น" : "เย็น/ปั่น", sub:baht(m.iced)}].filter(Boolean);
  if (!temps.find(t => t.k === sel.temp)) sel.temp = temps[0].k;
  const price = (sel.temp === "ร้อน" ? m.hot : m.iced) + (sel.bean ? CONFIG.BEAN_EXTRA : 0);
  let h = `<h2>${esc(m.name)}</h2><div class="sub">${esc(m.th)}</div>`;
  if (m.variants) h += `<div class="grp">รสชาติ / ชนิด</div>` + opts(m.variants, sel.variant, "variant");
  if (temps.length > 1) h += `<div class="grp">ร้อน / เย็น</div>` + opts(temps, sel.temp, "temp");
  if (m.bean) h += `<div class="grp">เมล็ดกาแฟ</div>` + opts(BEANS, sel.bean, "bean", "one");
  if (m.sweet) h += `<div class="grp">ระดับความหวาน</div>` + opts(SWEET, sel.sweet, "sweet");
  h += `<div class="grp">จำนวน</div><div class="qty"><button id="qm">−</button><b>${sel.qty}</b><button id="qp">+</button></div>`;
  h += `<div class="grp">หมายเหตุ (ถ้ามี)</div><input id="nt" maxlength="80" placeholder="เช่น แยกน้ำแข็ง" value="${esc(sel.note)}">`;
  h += `<button class="btn" id="addBtn" style="margin-top:18px"><span>เพิ่มลงตะกร้า</span><span>${baht(price * sel.qty)}</span></button>`;
  h += `<button class="btn ghost" id="cancelBtn">ยกเลิก</button>`;
  $("itemSheet").innerHTML = h;
  const keep = () => { sel.note = $("nt").value; };
  $("itemSheet").querySelectorAll(".opt").forEach(b => b.onclick = () => { buzz(); keep(); sel[b.dataset.k] = b.dataset.v; drawItem(); });
  $("qm").onclick = () => { buzz(); keep(); sel.qty = Math.max(1, sel.qty - 1); drawItem(); };
  $("qp").onclick = () => { buzz(); keep(); sel.qty = Math.min(20, sel.qty + 1); drawItem(); };
  $("cancelBtn").onclick = () => $("ovItem").classList.remove("show");
  $("addBtn").onclick = () => {
    sel.note = $("nt").value.trim();
    addLine(sel);
    $("ovItem").classList.remove("show");
    toast("เพิ่ม " + lineName(sel) + " แล้ว");
    refresh();
  };
}

/* ============ ตะกร้า ============ */
function pickupSlots(){
  const out = ["ตอนนี้ (เร็วที่สุด)"], d = new Date();
  d.setMinutes(Math.ceil((d.getMinutes() + 10) / 5) * 5, 0, 0);
  for (let k = 0; k < 8; k++){
    out.push(d.toLocaleTimeString("th-TH", {hour:"2-digit", minute:"2-digit", hour12:false}));
    d.setMinutes(d.getMinutes() + 10);
  }
  return out;
}
function cartHTML(){
  if (!cart.length) return `<h2>ตะกร้าของคุณ</h2><div class="empty">ยังไม่มีรายการ<br>แตะราคาในเมนูเพื่อเริ่มสั่งได้เลย</div><button class="btn ghost" id="backBtn">กลับไปเลือกเมนู</button>`;
  let h = `<h2>ตะกร้าของคุณ</h2>`;
  h += cart.map((s, k) => `<div class="crow"><div><b>${esc(lineName(s))}</b><small>${esc(lineDetail(s))}</small>
      <div class="mini"><button data-k="${k}" data-d="-1">−</button><b>${s.qty}</b><button data-k="${k}" data-d="1">+</button></div></div>
      <div class="rowr">${baht(unit(s) * s.qty)}</div></div>`).join("");
  const dsc = discountAmt(), D = CONFIG.DISCOUNT;
  if (dsc) h += `<div class="crow promo-row"><div><b>🎉 ส่วนลดสั่ง ${D.cups} แก้ว</b></div><div class="rowr">−${baht(dsc)}</div></div>`;
  else if (D && count() < D.cups) h += `<div class="promo-hint">สั่งอีก ${D.cups - count()} แก้ว ลดทันที ${baht(D.amount)}</div>`;
  h += `<div class="total"><span>รวม</span><span>${baht(total())}</span></div>`;
  h += `<div class="grp">เวลารับ</div>` + opts(pickupSlots(), pickup, "pickup");
  h += `<div class="grp">ชื่อสำหรับเรียกรับ</div><input id="cname" maxlength="30" value="${esc(user.displayName)}">`;
  h += `<button class="btn center" id="sendBtn" style="margin-top:16px">ยืนยันสั่งซื้อ</button>`;
  h += `<button class="btn ghost" id="backBtn">กลับไปเลือกเมนู</button>`;
  return h;
}
function bindCart(root){
  root.querySelectorAll(".mini button").forEach(b => b.onclick = () => {
    buzz(); const k = +b.dataset.k; cart[k].qty += +b.dataset.d;
    if (cart[k].qty <= 0) cart.splice(k, 1);
    refresh();
  });
  root.querySelectorAll(".opt").forEach(b => b.onclick = () => { buzz(); const n = root.querySelector("#cname"); if (n) user.displayName = n.value; pickup = b.dataset.v; drawCart(); });
  const bb = root.querySelector("#backBtn"); if (bb) bb.onclick = () => $("ovCart").classList.remove("show");
  const sb = root.querySelector("#sendBtn"); if (sb) sb.onclick = () => submit(root);
}
function drawCart(){
  const h = cartHTML();
  $("cartPane").innerHTML = h; bindCart($("cartPane"));
  $("cartSheet").innerHTML = h; bindCart($("cartSheet"));
  const eb = $("cartPane").querySelector("#backBtn"); if (eb) eb.remove();
}
function updateBar(){
  const n = count();
  const dsc = discountAmt();
  $("cartCount").textContent = n ? `ดูตะกร้า (${n} แก้ว)` + (dsc ? ` · ลด ${baht(dsc)}` : "") : "ตะกร้าว่าง";
  $("cartTotal").textContent = baht(total());
  $("cartBtn").disabled = !n;
}
function refresh(){
  renderMenu(); updateBar(); drawCart();
  if (!cart.length) $("ovCart").classList.remove("show");
}
$("cartBtn").onclick = () => { drawCart(); $("ovCart").classList.add("show"); };

// ข้อความสรุปที่ส่งเข้าแชทในนามลูกค้า (ใช้ liff.sendMessages ไม่นับโควตาข้อความของ OA)
function chatSummary(p){
  const lines = p.items.map(it => "• " + it.name + " × " + it.qty + (it.detail ? " (" + it.detail + ")" : "") + "  " + baht(it.unitPrice * it.qty));
  return ["☕ สั่งเครื่องดื่ม YO! PRESSO", "ชื่อ: " + p.customerName, "เวลารับ: " + p.pickup, "", ...lines, ...(p.discount ? ["ส่วนลด −" + baht(p.discount)] : []), "", "รวม " + baht(p.total)].join("\n");
}

async function submit(root){
  if (sending) return;
  const name = (root.querySelector("#cname").value || "").trim() || "ลูกค้า";
  sending = true;
  const btn = root.querySelector("#sendBtn"); btn.disabled = true; btn.textContent = "กำลังส่ง...";
  const payload = {
    userId: user.userId, customerName: name, pickup,
    items: cart.map(s => ({name: lineName(s), detail: lineDetail(s), qty: s.qty, unitPrice: unit(s)})),
    discount: discountAmt(), total: total()
  };
  try {
    if (!CONFIG.ENDPOINT.startsWith("YOUR_")){
      await fetch(CONFIG.ENDPOINT, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(payload)});
    } else { console.log("DEMO order", payload); }
    // ส่งสรุปเข้าแชท (เฉพาะเมื่อเปิดจากแอป LINE และเปิดสิทธิ์ chat_message.write ใน LIFF) ถ้าไม่ได้ก็ข้ามไป ไม่กระทบออเดอร์
    let sentToChat = false;
    try {
      if (typeof liff !== "undefined" && liff.isInClient && liff.isInClient()) {
        await liff.sendMessages([{type:"text", text: chatSummary(payload)}]);
        sentToChat = true;
      }
    } catch(e){ console.warn("sendMessages ไม่สำเร็จ:", e); }
    cart = [];
    const done = `<div class="done"><div style="font-size:56px">☕</div><h2>ส่งออเดอร์แล้ว</h2><p>ร้านได้รับออเดอร์ของคุณ ${esc(name)} แล้ว${sentToChat ? "<br>สรุปออเดอร์ส่งไว้ในแชทนี้แล้ว" : ""}</p><button class="btn center" id="closeBtn">ปิด</button></div>`;
    $("cartPane").innerHTML = done; $("cartSheet").innerHTML = done; $("ovCart").classList.add("show");
    renderMenu(); updateBar();
    document.querySelectorAll("#closeBtn").forEach(b => b.onclick = () => {
      try { if (liff.isInClient()) { liff.closeWindow(); return; } } catch(e){}
      $("ovCart").classList.remove("show"); drawCart();
    });
  } catch(e){
    btn.disabled = false; btn.textContent = "ส่งไม่สำเร็จ ลองอีกครั้ง";
  } finally { sending = false; }
}

/* ============ เริ่มทำงาน ============ */
renderMenu(); updateBar(); drawCart(); initLiff();
if (promoText()) { $("promo").textContent = "🎉 " + promoText(); $("promo").classList.add("on"); }
</script>
</body>
